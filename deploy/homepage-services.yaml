# Homepage (gethomepage) entry for stratechery-search
#
# On ryzen this is **not** used: the dashboard entry is generated from the
# container labels in docker-compose.yml, which the local docker provider reads
# straight off the socket. Keep the two in step if you switch this box to a
# file-only Homepage setup.
#
# Conventions that matter here:
#   href        -> the tailnet name. The published port is bound to 127.0.0.1,
#                  so `http://ryzen:8091` and `http://nas.local:8091` are both
#                  dead; `tailscale serve` fronts the app on :80.
#   widget url  -> 127.0.0.1, because Homepage runs with network_mode: host on
#                  ryzen and never depends on DNS.
#   widget      -> /stats, not /livez: two real numbers (articles, passages)
#                  beat a status string that only says "ok".

- Data & Markets:
    - Stratechery Search:
        icon: mdi-text-search
        href: http://ryzen.tail86fd19.ts.net/
        description: full-text search over 1,691 Stratechery articles, 2016 to now
        widget:
          type: customapi
          url: http://127.0.0.1:8091/stats
          mappings:
            - field: articles
              label: articles
            - field: chunks
              label: passages
