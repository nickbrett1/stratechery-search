# The 3-pre gazetteer: companies and people, one canonical id per article.
#
# Read by `stratechery_search.facets` and built into `facets.sqlite` by
# `python -m stratechery_search.build_facets`. Versioned here rather than in
# appdata so every change is a reviewable diff — the argument that killed the
# `$DATA_ROOT/vocab.yaml` placement.
#
# Rules of the file, all enforced at load time:
#   * `id` is lower_snake_case (it is a JSON key and a filter value), `kind` is
#     `company` or `person`, and `name` must appear in its own `aliases`.
#   * `case_sensitive` must be a subset of `aliases`. Use it for any surface that
#     is also an ordinary English word: `WHO` matched the pronoun 1,379 times and
#     the organisation 7, which is the measured reason this field exists.
#   * Comments own their whole line. No inline `#`.
#   * `measured:` is free text and is the *record* of why an entity was admitted.
#     The authoritative counts are in `facets-report.json`; the numbers below are
#     copied from it so the decision travels with the file.
#
# Admission floor: 20 articles. Below that a facet chip is noise — the reader
# clicks it and gets three results — and the corpus has no shortage of better
# dimensions. Rejections are recorded at the bottom rather than deleted.

version: 1

entities:
