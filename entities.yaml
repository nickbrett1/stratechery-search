# Rejected on 2026-11-08, with the reason, so nobody re-mines them hopefully:
#   * FTC / DOJ / EU / GDPR / UK — regulators, not companies or people. Out of
#     scope for 3-pre (`KINDS` is company|person); a regulator facet is a real
#     idea and a different one.
#   * Sharp / Sharp Tech — the podcast, and "sharp" is an English word.
#   * Store / Services / App Store / PC / TV / API / CEO — noun phrases, not
#     entities. They are exactly the shape a naive capitalised-token miner
#     returns, which is why the admission test is a human read.
#   * Any company measured under the 20-article floor. The first build's
#     `per_entity` report is where that list comes from, not from memory: a chip
#     that returns three results is noise, and the corpus has no shortage of
#     better dimensions.
