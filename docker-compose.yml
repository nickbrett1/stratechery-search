# Docker Compose configuration for stratechery-search
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/stratechery-search:latest
    container_name: stratechery-search
    restart: unless-stopped

    # Bound to the tailnet address, not to 0.0.0.0: the service is reachable
    # from your own devices over Tailscale and from nothing else — not the LAN,
    # not the internet. (127.0.0.1 would be reachable only on the host itself.)
    # Loopback only: `tailscale serve` proxies http://ryzen.tail86fd19.ts.net/
    # to this socket, so the service itself never listens on a non-loopback
    # interface. (A tailnet-bound port also works but is a wider door.)
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - /srv/datasets/stratechery-archive:/archive:ro
      - /srv/docker/stratechery-search/data:/data
    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      ARCHIVE_ROOT: ${ARCHIVE_ROOT:-/archive}
      DATA_ROOT: ${DATA_ROOT:-/data}
      INDEX_PATH: ${INDEX_PATH:-/data/index/search.sqlite}
      PORT: ${PORT:-8080}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Homepage (gethomepage) reads these straight off the container: the
      # dashboard entry is the labels, so they are the thing to keep true.
      # browser-facing href -> the tailnet name (the port is loopback-only);
      # widget -> 127.0.0.1, because Homepage is host-networked on ryzen.
      - "homepage.group=Data & Markets"
      - "homepage.name=Stratechery Search"
      # Homepage orders a group by `weight` first (names only break ties), and the
      # file-based entries get 100, 200, 300 ... in the order services.yaml lists them.
      # A label-derived service defaults to weight 0, which puts it at the TOP of the
      # group — the same bug that floats data-sourcing-agent and "gate grader" above
      # n8n. 1100 sorts it after Potato (1000), which is also where it belongs
      # alphabetically: P before S, and nothing in this group starts with T-Z yet.
      # Re-check this number when a tile starting T–Z joins Data & Markets.
      - "homepage.weight=1100"
      - "homepage.icon=mdi-text-search"
      - "homepage.href=https://ryzen.tail86fd19.ts.net/"
      - "homepage.description=full-text search over 1,691 Stratechery articles, 2016 to now"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://127.0.0.1:8091/stats"
      - "homepage.widget.mappings[0].field=articles"
      - "homepage.widget.mappings[0].label=articles"
      - "homepage.widget.mappings[1].field=chunks"
      - "homepage.widget.mappings[1].label=passages"
