[project]
name = "stratechery-search"
version = "0.1.0"
description = "A stratechery-search project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
# Phase 1 was deliberately stdlib-only, and that is still true of everything on
# the default path. The vector layer (phase 2) cannot preserve it, so the one
# exception is pinned exactly rather than ranged: the wheel wraps a Rust core
# whose on-disk format and builder API move between minor versions, and it is
# imported lazily (only behind `hybrid=1`) so a broken install costs the flag,
# not the service.
dependencies = [
    "lancedb==0.40.0",
    # Phase 4's `similar.py` multiplies matrices in numpy. It already arrives
    # transitively via lancedb → pyarrow, and relying on that is how an import
    # works on one host and fails on the next (phase 4 §5, open number 2).
    # Ranged rather than pinned: numpy's ABI is stable where Lance's on-disk
    # format is not, and pinning it would fight lancedb's own requirement.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
# Pin the language level. Without it ruff infers target-version from
# requires-python, and target-gated rules (e.g. UP017 "use datetime.UTC") then
# switch on or off depending on how the config resolved.
target-version = "py311"

[tool.ruff.lint]
# Pin the enforced rule set. Without an explicit select the enabled set is
# whatever ruff's built-in default is for the resolved target version, which
# also drifts between ruff releases - so the same source could pass locally
# and fail in CI (or vice versa). Written down here so `ruff check src tests`
# is deterministic and local lint agrees with CI. Update `select` (or add
# `ignore`) deliberately when you want a different rule set.
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
